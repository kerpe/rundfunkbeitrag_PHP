# Uploads the site to Hostinger over FTP whenever main changes.
# public_html/ goes to the site's public_html; private/ goes next to it,
# outside the web root. Files that are not in the repository (config.php,
# installation-key.php, data/) are never touched.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. ftp.rundfunkbeitrag.help or the IP shown in hPanel
#   FTP_USERNAME  hPanel -> Files -> FTP Accounts
#   FTP_PASSWORD
# Optional repository variables (same page, "Variables" tab):
#   FTP_PUBLIC_DIR   default: public_html/
#   FTP_PRIVATE_DIR  default: private/
#   FTP_PROTOCOL     default: ftps (use ftp only if ftps fails)
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Check FTP settings
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP secrets are not set yet, so nothing was deployed. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: Upload public_html
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./public_html/
          server-dir: ${{ vars.FTP_PUBLIC_DIR || 'public_html/' }}

      - name: Upload private
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./private/
          server-dir: ${{ vars.FTP_PRIVATE_DIR || 'private/' }}
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            installation-key.php
            data/**
