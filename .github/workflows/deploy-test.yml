# Uploads the branch "test" to the hidden test copy test.rundfunkbeitragsupport.de
# (its own website, database, config.php and data in the same Hostinger account).
# The live site is never touched: deploy.yml only runs for main. To try a branch:
#   git push origin <branch>:test --force
# The test copy keeps search engines out (indexing stays off in its config.php).
# Uses the same FTP secrets as deploy.yml.
name: Deploy test copy

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One site at a time, so the shared FTP account never has two sessions.
      max-parallel: 1
      matrix:
        include:
          - site: test.rundfunkbeitragsupport.de
            public_dir: domains/test.rundfunkbeitragsupport.de/public_html/
            private_dir: domains/test.rundfunkbeitragsupport.de/private/
            require_config: false
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Check FTP settings
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP secrets are not set yet, so nothing was deployed. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      # Refuse to upload unless the live site is where we expect it, so a
      # wrong folder setting can never create a second copy of the site.
      - name: Check the target folders on the server
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PUBLIC_DIR: ${{ matrix.public_dir }}
          PRIVATE_DIR: ${{ matrix.private_dir }}
          PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          REQUIRE_CONFIG: ${{ matrix.require_config }}
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host%/}"
          tls=(); [ "$PROTOCOL" = ftps ] && tls=(--ssl-reqd --insecure)
          ftp() { curl -sS --max-time 60 "${tls[@]}" --user "$FTP_USERNAME:$FTP_PASSWORD" "$@"; }
          ok=1
          # The public folder only has to exist: Hostinger's own Git deploy can leave it without index.php.
          ftp --list-only "ftp://$host/${PUBLIC_DIR}" >/dev/null || { echo "::error::${PUBLIC_DIR} not found on the server"; ok=0; }
          if ! ftp -I "ftp://$host/${PRIVATE_DIR}config.php" >/dev/null; then
            if [ "$REQUIRE_CONFIG" = true ]; then echo "::error::${PRIVATE_DIR}config.php not found on the server"; ok=0
            else echo "::warning::${PRIVATE_DIR}config.php not found yet; uploading the code anyway"; fi
          fi
          if [ $ok = 0 ]; then
            echo "Top-level folders visible over FTP:"; ftp --list-only "ftp://$host/" || true
            for d in $(ftp --list-only "ftp://$host/domains/" 2>/dev/null | grep -v '^\.'); do
              echo "domains/$d/:"; ftp --list-only "ftp://$host/domains/$d/" || true
            done
            exit 1
          fi

      # lftp instead of FTP-Deploy-Action: on Hostinger the action's FTPS data
      # connection resets when it enters folders that already exist (private/app,
      # and public_html of a freshly created site).
      - name: Upload public_html and private
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PUBLIC_DIR: ${{ matrix.public_dir }}
          PRIVATE_DIR: ${{ matrix.private_dir }}
          PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          host="${FTP_SERVER#ftp://}"; host="${host%/}"
          ssl=false; [ "$PROTOCOL" = ftps ] && ssl=true
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp --env-password -u "$FTP_USERNAME" "$host" -e "
            set ftp:ssl-force $ssl; set ftp:ssl-protect-data $ssl; set ssl:verify-certificate no;
            set net:max-retries 3; set net:timeout 30;
            mirror -R --verbose --no-perms ./public_html/ '$PUBLIC_DIR';
            mirror -R --verbose --no-perms \
              -x '^config\.php$' -x '^installation-key\.php$' -x '^data/' -x '(^|/)\.git' \
              ./private/ '$PRIVATE_DIR';
            bye"
